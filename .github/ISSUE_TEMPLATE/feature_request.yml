name: Feature request
description: Suggest an idea for Shopify Sync.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Check the [roadmap](https://github.com/roadsterworks/craft-shopify-sync/blob/main/ROADMAP.md) first. If it's already there, a comment about how you'd use it helps decide what comes next.
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The task or problem, rather than the solution.
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: How would you like it to work?
